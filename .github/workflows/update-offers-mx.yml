name: Update MX MFO offers from PDL-Profit API

on:
  schedule:
    # Todos los días a las 06:00 UTC (00:00 Ciudad de México en horario estándar)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  update-offers-mx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch MX offers from PDL-Profit API
        env:
          PDL_API_KEY: ${{ secrets.PDL_API_KEY }}
        run: python fetch_offers_mx.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mfo-live-data-mx.json
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: update MX MFO offers data ($(date -u +%Y-%m-%d))"
          git push
