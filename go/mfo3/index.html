<body>
  <script>
    const JSON_URL = '/mfo-live-data.json';
    const FALLBACK_URL = 'https://tds.pdl-profit.com?offerid=1147&affid=62311';

    async function redirectUser() {
      try {
        const response = await fetch(JSON_URL, {
          cache: 'no-store'
        });

        const data = await response.json();
        const allOffers = data.offers || [];

        // ТІЛЬКИ ОФЕРИ ЗІ ШВИДКИМ РІШЕННЯМ
        // Відбираємо офери, де badge прямо містить
        // "Швидке рішення за хвилини".
        const fastDecisionOffers = allOffers.filter(o =>
          typeof o.badge === 'string' &&
          o.badge.toLowerCase().includes('швидке рішення за хвилини')
        );

        if (!fastDecisionOffers.length) {
          throw new Error('No fast-decision offers');
        }

        // Максимум TOP-10 оферів.
        // Оскільки в JSON немає EPC/CR, використовуємо порядок
        // оферів у live JSON як поточний пріоритет.
        const topOffers = fastDecisionOffers.slice(0, 10);

        // Історія вже показаних оферів цієї групи
        let viewedIds = JSON.parse(
          localStorage.getItem('viewed_fast_decision_offers') || '[]'
        );

        // Видаляємо з історії офери, яких більше немає в актуальному списку
        const topIds = new Set(topOffers.map(o => o.id));
        viewedIds = viewedIds.filter(id => topIds.has(id));

        // Беремо ті, що ще не показувалися
        let available = topOffers.filter(
          o => !viewedIds.includes(o.id)
        );

        // Коли всі показані — запускаємо ротацію заново
        if (!available.length) {
          viewedIds = [];
          available = topOffers;
        }

        // Перший доступний офер
        const target = available[0];

        // Записуємо його в історію
        viewedIds.push(target.id);

        localStorage.setItem(
          'viewed_fast_decision_offers',
          JSON.stringify(viewedIds)
        );

        // UTM
        const separator = target.ref.includes('?') ? '&' : '?';

        const finalUrl =
          target.ref +
          separator +
          'utm_source=tg&utm_creative=btn_group3';

        window.location.replace(finalUrl);

      } catch (err) {
        console.error(err);
        window.location.replace(FALLBACK_URL);
      }
    }

    setTimeout(redirectUser, 50);
  </script>
</body>
