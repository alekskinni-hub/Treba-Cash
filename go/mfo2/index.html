<body>
  <script>
    const JSON_URL = '/mfo-live-data.json';
    const FALLBACK_URL = 'https://tds.pdl-profit.com?offerid=1147&affid=62311';

    async function redirectUser() {
      try {
        const response = await fetch(JSON_URL, {
          cache: 'no-store'
        });

        const data = await response.json();
        const allOffers = data.offers || [];

        // ============================================
        // ТІЛЬКИ АКЦІЙНІ ОФЕРИ / ПІД 0
        // Аналогічно до фільтра "🔥 Тільки акційні умови"
        // в index (65).html
        // ============================================
        const promoOffers = allOffers.filter(o => o.hasZeroBadge === true);

        if (!promoOffers.length) {
          throw new Error('No promo offers');
        }

        // Історія вже показаних промо-оферів
        let viewedIds = JSON.parse(
          localStorage.getItem('viewed_promo_offers') || '[]'
        );

        // Залишаємо в історії тільки ті ID,
        // які досі є актуальними промо-оферами
        const promoIds = new Set(promoOffers.map(o => o.id));

        viewedIds = viewedIds.filter(id => promoIds.has(id));

        // Беремо офери, які ще не показували цьому користувачу
        let available = promoOffers.filter(
          o => !viewedIds.includes(o.id)
        );

        // Якщо всі промо-офери вже показані —
        // починаємо ротацію заново
        if (!available.length) {
          viewedIds = [];
          available = promoOffers;
        }

        // Беремо перший доступний промо-офер
        const target = available[0];

        // Додаємо його в історію
        viewedIds.push(target.id);

        localStorage.setItem(
          'viewed_promo_offers',
          JSON.stringify(viewedIds)
        );

        // UTM
        const separator = target.ref.includes('?') ? '&' : '?';

        const finalUrl =
          target.ref +
          separator +
          'utm_source=tg&utm_creative=btn_promo';

        window.location.replace(finalUrl);

      } catch (err) {
        console.error(err);
        window.location.replace(FALLBACK_URL);
      }
    }

    setTimeout(redirectUser, 50);
  </script>
</body>
</html>
