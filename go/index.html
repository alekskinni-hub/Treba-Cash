<body>
  <!-- Google Tag Manager (noscript) -->

  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <script>
    /*
     * РОТАЦІЯ 5 ОФЕРІВ: Pango UA, Ranok UA, MyCredit UA, Minibank UA, Creditplus UA
     *
     * Розподіл: випадковий (random) — кожен користувач отримує випадковий офер.
     * localStorage не використовується.
     *
     * UTM-логіка:
     * - Якщо в адресному рядку вже є utm_source/utm_medium/utm_campaign — беруться вони.
     * - Якщо параметрів немає — підставляються дефолтні (для SMS-розсилки).
     * - Щоб змінити канал: просто додай ?utm_source=viber&utm_medium=... до посилання.
     *
     * Дефолтні мітки (SMS):
     *   utm_source=sms
     *   utm_medium=sms
     *   utm_campaign=trebacash_sms
     */

    const FALLBACK_URL = 'https://tds.pdl-profit.com?offerid=1147&affid=62311';

    // ── Дефолтні UTM (застосовуються коли посилання без міток) ──────────────
    const DEFAULT_UTM = {
      utm_source:   'sms',
      utm_medium:   'sms',
      utm_campaign: 'trebacash_sms'
    };
    // ────────────────────────────────────────────────────────────────────────

    const OFFERS = [
      { id: 2700, name: 'Pango UA',      ref: 'https://tds.pdl-profit.com?offerid=2700&affid=62311' },
      { id: 3617, name: 'Ranok UA',      ref: 'https://tds.pdl-profit.com?offerid=3617&affid=62311' },
      { id: 1154, name: 'MyCredit UA',   ref: 'https://tds.pdl-profit.com?offerid=1154&affid=62311' },
      { id: 3967, name: 'Minibank UA',   ref: 'https://tds.pdl-profit.com?offerid=3967&affid=62311' },
      { id: 1158, name: 'Creditplus UA', ref: 'https://tds.pdl-profit.com?offerid=1158&affid=62311' }
    ];

    // Будує рядок UTM-параметрів:
    // бере з адресного рядка, решту доповнює дефолтами.
    function buildUtmString() {
      const incoming = new URLSearchParams(window.location.search);
      const utmKeys  = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
      const result   = new URLSearchParams();

      utmKeys.forEach(key => {
        if (incoming.has(key)) {
          result.set(key, incoming.get(key));         // пріоритет — з URL
        } else if (DEFAULT_UTM[key]) {
          result.set(key, DEFAULT_UTM[key]);           // інакше — дефолт
        }
      });

      // Передаємо також click-id (gclid, fbclid тощо) якщо є
      incoming.forEach((value, key) => {
        if (!key.startsWith('utm_') && (key.endsWith('clid') || key === 'yclid')) {
          result.set(key, value);
        }
      });

      return result.toString();
    }

    function redirectUser() {
      try {
        // Випадковий індекс — кожен користувач отримує свій офер
        const randomIndex = Math.floor(Math.random() * OFFERS.length);
        const target      = OFFERS[randomIndex];

        const utmString = buildUtmString();
        const separator = target.ref.includes('?') ? '&' : '?';
        const finalUrl  = target.ref + separator + utmString;

        window.location.replace(finalUrl);

      } catch (err) {
        console.error('Rotation error:', err);
        window.location.replace(FALLBACK_URL);
      }
    }

    setTimeout(redirectUser, 50);
  </script>
</body>
</html>
