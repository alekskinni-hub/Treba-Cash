<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Treba Cash Banner GIF (960x540)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Точний розмір баннера 960x540 (16:9) */
    .banner {
      width: 960px;
      height: 540px;
      background: radial-gradient(circle at 85% 20%, #1a3c28 0%, #0a1118 65%);
      position: relative;
      padding: 33px 45px;
      color: #fff;
      overflow: hidden;
    }

    /* Фонове сяйво */
    .banner::before {
      content: '';
      position: absolute;
      width: 390px;
      height: 390px;
      background: #2ecc71;
      filter: blur(150px);
      opacity: 0.15;
      top: -60px;
      right: -60px;
    }

    /* Логотип */
    .logo {
      position: absolute;
      top: 36px;
      left: 45px;
      width: 128px;
      height: auto;
      filter: drop-shadow(0 6px 15px rgba(0,0,0,0.6));
    }

    /* Кредитна картка */
    .card-block {
      position: absolute;
      left: 45px;
      top: 177px;
      width: 345px;
      height: 218px;
      background: linear-gradient(135deg, #1e3c2b, #0d1f15);
      border: 3px solid #2ecc71;
      border-radius: 24px;
      box-shadow: 0 0 38px rgba(46, 204, 113, 0.25);
      overflow: hidden;
    }

    /* Чорна магнітна смуга */
    .card-stripe {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      height: 39px;
      background: #080e0a;
    }

    /* Золотий 3D-чіп */
    .card-chip {
      position: absolute;
      top: 87px;
      left: 30px;
      width: 54px;
      height: 39px;
      background: linear-gradient(135deg, #f39c12, #f1c40f);
      border-radius: 9px;
      border: 2px solid #d35400;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
    }
    .card-chip::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(0,0,0,0.4);
    }

    .card-title {
      position: absolute;
      bottom: 18px;
      left: 30px;
      font-size: 16px;
      font-weight: 800;
      color: #2ecc71;
      letter-spacing: 1.5px;
    }

    .card-logos {
      position: absolute;
      bottom: 15px;
      right: 22px;
      font-size: 15px;
      font-weight: 900;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1.5px;
    }

    /* Анімований бейдж відсотків */
    .badge {
      position: absolute;
      top: 153px;
      left: 180px;
      z-index: 10;
      background: #27ae60;
      padding: 9px 21px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 0 22px rgba(39, 174, 96, 0.8);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .badge-num {
      color: #fff;
      font-size: 24px;
      min-width: 63px;
      text-align: center;
    }

    /* Текстовий блок */
    .content {
      margin-left: 420px;
      margin-top: 39px;
    }

    h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 0.8px;
    }
    h1 span { color: #2ecc71; }

    .subtitle {
      font-size: 22px;
      color: #d0dcd5;
      margin: 5px 0 21px 0;
      font-weight: 600;
    }

    .bullet {
      font-size: 20px;
      margin-bottom: 12px;
      color: #c5d4cb;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bullet-dot {
      width: 11px;
      height: 11px;
      background: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 12px #2ecc71;
    }
    .bullet span { color: #f1c40f; font-weight: 800; }

    /* Мигаюча кнопка */
    .btn-pulsing {
      display: block;
      width: 465px;
      height: 75px;
      background: linear-gradient(90deg, #27ae60, #2ecc71);
      border-radius: 21px;
      text-align: center;
      line-height: 75px;
      font-weight: 900;
      font-size: 24px;
      color: #fff;
      margin-top: 24px;
      animation: pulseGlow 1.2s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        filter: brightness(1);
      }
      100% {
        transform: scale(1.03);
        box-shadow: 0 0 42px rgba(46, 204, 113, 0.9), 0 0 15px rgba(255, 255, 255, 0.6);
        filter: brightness(1.15);
      }
    }

    /* Нижня плашка гарантій */
    .bottom-bar {
      position: absolute;
      bottom: 21px;
      left: 45px;
      right: 45px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1.5px solid rgba(255, 255, 255, 0.12);
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 17px;
      color: #92a89c;
      font-weight: 600;
    }

    .trust-item span {
      color: #2ecc71;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="banner">
    <!-- Посилання на логотип -->
    <img src="https://trebacash.site/assets/logo-icon.png" class="logo" alt="Treba Cash Logo">

    <!-- Бейдж відсотків схвалення -->
    <div class="badge">
      <span>✓</span>
      <span id="percent" class="badge-num">98%</span>
      <span style="font-size: 15px; opacity: 0.9;">СХВАЛЕНО</span>
    </div>

    <!-- Картка з деталями -->
    <div class="card-block">
      <div class="card-stripe"></div>
      <div class="card-chip"></div>
      <div class="card-title">TREBA CASH CARD</div>
      <div class="card-logos">VISA / MC</div>
    </div>

    <!-- Основний контент -->
    <div class="content">
      <h1>TREBA <span>CASH ⚡</span></h1>
      <div class="subtitle">Персональний підбір позик</div>
      
      <div class="bullet">
        <div class="bullet-dot"></div>
        <div>Перша позика під <span>0.01%</span></div>
      </div>
      <div class="bullet">
        <div class="bullet-dot"></div>
        <div>Рішення за <b>2 хвилини</b> без дзвінків</div>
      </div>
      <div class="bullet">
        <div class="bullet-dot"></div>
        <div>Цілодобово <b>24/7</b> без довідок про доходи</div>
      </div>

      <!-- Кнопка зі стрілкою вниз -->
      <div class="btn-pulsing">НАТИСНІТЬ «СТАРТ» 👇</div>
    </div>

    <!-- Нижня плашка -->
    <div class="bottom-bar">
      <div class="trust-item">🔒 <span>256-bit</span> SSL Захист</div>
      <div class="trust-item">⚡ Понад <span>40+</span> ліцензованих МФО</div>
      <div class="trust-item">💳 Зарахування на <span>будь-яку</span> картку</div>
    </div>
  </div>

  <script>
    // Динамічна зміна відсотків (від 84% до 99%)
    const percentEl = document.getElementById('percent');
    const values = [84, 89, 93, 97, 82, 91, 95, 98, 99, 94, 98];
    let index = 0;

    setInterval(() => {
      percentEl.textContent = values[index] + '%';
      index = (index + 1) % values.length;
    }, 400);
  </script>

</body>
</html>
