<body>
  <script>
    const JSON_URL = '/mfo-live-data.json';
    const FALLBACK_URL = 'https://tds.pdl-profit.com?offerid=1147&affid=62311';

    async function redirectUser() {
      try {
        const response = await fetch(JSON_URL);
        const data = await response.json();
        const allOffers = data.offers || [];

        // ДІАПАЗОН ДЛЯ МФО 1: з 1 по 14 офер (індекси 0-13)
        const groupOffers = allOffers.slice(0, 14);
        if (!groupOffers.length) throw new Error('No offers in group');

        let viewedIds = JSON.parse(localStorage.getItem('viewed_group_1') || '[]');
        let available = groupOffers.filter(o => !viewedIds.includes(o.id));

        // Якщо всі офери з цієї групи вже переглянуті — скидаємо історію групи
        if (!available.length) {
          viewedIds = [];
          available = groupOffers;
        }

        // Беремо перший доступний з цієї групи
        const target = available[0];
        
        viewedIds.push(target.id);
        localStorage.setItem('viewed_group_1', JSON.stringify(viewedIds));

        let finalUrl = target.ref + '&utm_source=tg&utm_creative=btn_group1';
        window.location.replace(finalUrl);

      } catch (err) {
        console.error(err);
        window.location.replace(FALLBACK_URL);
      }
    }

    setTimeout(redirectUser, 50);
  </script>
</body>
